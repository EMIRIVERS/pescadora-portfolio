name: CI

on:
  push:
  pull_request:

# The Next.js app lives in the xico-films/ subdirectory of the repo root.
defaults:
  run:
    working-directory: xico-films

jobs:
  build:
    name: Typecheck, build & lint (Node 20)
    runs-on: ubuntu-latest

    env:
      # Public Supabase values are read at build time. Provide them via repo
      # secrets so the production build can resolve client config. They fall
      # back to harmless placeholders when the secrets are absent so that the
      # pipeline still runs on forks / PRs without secret access.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
      # Disable Next.js telemetry in CI.
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: xico-films/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
